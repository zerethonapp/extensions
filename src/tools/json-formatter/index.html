<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Formatter — Zerethon Tools (offline)</title>
  <link rel="stylesheet" href="../_shell/shell.css" />
</head>
<body>
  <div class="zt-page" id="zt-page">
    <!-- topbar injected by JS -->

    <!-- Settings bar -->
    <div class="zt-controls">
      <label class="zt-check" for="indent">Indent</label>
      <select id="indent" class="zt-select" aria-label="Indent size">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
      <label class="zt-check">
        <input type="checkbox" id="sort-keys" /> Sort keys
      </label>
      <span class="zt-spacer"></span>
      <button type="button" id="sample" class="zt-btn" title="Insert a sample payload">Sample</button>
      <button type="button" id="clear" class="zt-btn">Clear</button>
    </div>

    <!-- Workspace grid -->
    <div class="zt-grid zt-grid-2" id="grid">
      <!-- INPUT PANE -->
      <section class="zt-pane" id="pane-input">
        <header class="zt-pane-toolbar" id="toolbar-input">
          <div class="zt-pane-toolbar-left">
            <span class="zt-pane-label">Input</span>
            <span class="zt-pane-meta" id="input-meta"></span>
          </div>
          <div class="zt-pane-toolbar-right" id="input-actions">
            <!-- icon buttons injected by JS -->
          </div>
        </header>
        <textarea id="input" class="zt-textarea" placeholder='{ "paste": "your JSON here" }' spellcheck="false" autofocus></textarea>
        <div id="error" class="zt-error" hidden></div>
      </section>

      <!-- OUTPUT PANE -->
      <section class="zt-pane" id="pane-output">
        <header class="zt-pane-toolbar" id="toolbar-output">
          <div class="zt-pane-toolbar-left">
            <div class="zt-segmented-sm" role="tablist" aria-label="Output mode">
              <button type="button" id="m-pretty" class="is-on">Pretty</button>
              <button type="button" id="m-minify">Minified</button>
              <button type="button" id="m-tree" title="Collapsible tree view">Tree</button>
            </div>
          </div>
          <div class="zt-pane-toolbar-right" id="output-actions">
            <!-- icon buttons injected by JS -->
          </div>
        </header>
        <textarea id="output" class="zt-textarea" readonly spellcheck="false" placeholder="Formatted output will appear here…"></textarea>
        <div id="output-tree" class="zt-tree" hidden></div>
      </section>
    </div>

    <!-- Stats strip -->
    <div class="zt-stats" id="stats">
      <span class="zt-stats-spacer"></span>
      <span><kbd>⌘↵</kbd> format · <kbd>Esc</kbd> exit fullscreen</span>
    </div>
  </div>
  <script type="module" src="tool.js"></script>
</body>
</html>
