<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Base64 Encoder &amp; Decoder — Zerethon Tools (offline)</title>
  <link rel="stylesheet" href="../_shell/shell.css" />
</head>
<body>
  <div class="zt-page" id="zt-page">
    <!-- topbar injected by JS -->

    <div class="zt-controls">
      <div class="zt-segmented" role="tablist" aria-label="Mode">
        <button type="button" id="m-encode" class="is-on">Encode</button>
        <button type="button" id="m-decode">Decode</button>
      </div>
      <label class="zt-check">
        <input type="checkbox" id="url-safe" /> URL-safe variant
      </label>
      <span class="zt-spacer"></span>
      <button type="button" id="sample" class="zt-btn">Sample</button>
      <button type="button" id="clear" class="zt-btn">Clear</button>
    </div>

    <div class="zt-grid zt-grid-2" id="grid">
      <section class="zt-pane" id="pane-input">
        <header class="zt-pane-toolbar">
          <div class="zt-pane-toolbar-left">
            <span class="zt-pane-label" id="input-label">Plain text</span>
          </div>
          <div class="zt-pane-toolbar-right" id="input-actions"></div>
        </header>
        <textarea id="input" class="zt-textarea" placeholder="Paste text to encode…" spellcheck="false" autofocus></textarea>
        <div id="error" class="zt-error" hidden></div>
      </section>

      <section class="zt-pane" id="pane-output">
        <header class="zt-pane-toolbar">
          <div class="zt-pane-toolbar-left">
            <span class="zt-pane-label">Output</span>
          </div>
          <div class="zt-pane-toolbar-right" id="output-actions"></div>
        </header>
        <textarea id="output" class="zt-textarea" readonly spellcheck="false" placeholder="Encoded / decoded result will appear here…"></textarea>
      </section>
    </div>
  </div>
  <script type="module" src="tool.js"></script>
</body>
</html>
